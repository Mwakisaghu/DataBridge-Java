name: CI

on:
  push:
    branches: [main, "develop/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and test (includes the golden tests on the sample data)
        run: mvn -B verify
      - uses: actions/upload-artifact@v4
        with:
          name: databridge-app
          path: databridge-app/target/databridge-app.jar
          if-no-files-found: error
