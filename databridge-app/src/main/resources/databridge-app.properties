# DataBridge server: infrastructure settings only. Business settings (retention, limits,
# templates) are setups in the database, edited through /api/setup.
#
# Override with --config <file> or environment variables:
#   DATABRIDGE_HOST, DATABRIDGE_PORT, DATABRIDGE_DB_URL, DATABRIDGE_DB_USER,
#   DATABRIDGE_DB_PASSWORD, DATABRIDGE_SWEEP_MINUTES, DATABRIDGE_AUTH, DATABRIDGE_SECURE_COOKIE,
#   DATABRIDGE_SESSION_IDLE_MINUTES, DATABRIDGE_SESSION_ABSOLUTE_HOURS, DATABRIDGE_ADMIN_PASSWORD, DATABRIDGE_UI_DIR

# 127.0.0.1 = this machine only. Use 0.0.0.0 behind a TLS reverse proxy to serve a team
# (then set auth.secureCookie=true).
server.host=127.0.0.1
server.port=8085

# Development default: H2 database files in <your home>/databridge-data, SQL Server mode.
# Data survives restarts; delete that folder (with the server stopped) to start afresh.
# It holds setups, clients, runs, dataset metadata and the audit trail: never client data.
# AUTO_SERVER lets a database tool open the same files while the server runs.
#
# Other databases, e.g.:
#   db.url=jdbc:sqlserver://localhost:1433;databaseName=DataBridge;encrypt=true;trustServerCertificate=true
#   In-memory (lost on restart): jdbc:h2:mem:databridge;MODE=MSSQLServer;DATABASE_TO_UPPER=FALSE;DB_CLOSE_DELAY=-1
db.url=jdbc:h2:file:~/databridge-data/databridge;MODE=MSSQLServer;DATABASE_TO_UPPER=FALSE;AUTO_SERVER=TRUE
db.user=sa
db.password=

# How often expired client workspaces are destroyed.
retention.sweepIntervalMinutes=15

# The built UI (the dist folder of DataBridge-FrontEnd) to serve next to the API, so production
# needs no Node and the browser sees one origin. Empty = API only (development uses Vite's proxy).
server.uiDir=

# Sign-in. local = DataBridge user accounts (default). none = no sign-in, every caller has
# every role; development only and refused unless server.host is local.
auth.mode=local
# Send the session cookie only over HTTPS. Turn on whenever users reach DataBridge over TLS.
auth.secureCookie=false
auth.sessionIdleMinutes=120
auth.sessionAbsoluteHours=12
# First start only, when no users exist: the admin's temporary password. Leave empty to have
# one generated and printed once to the console.
auth.initialAdminPassword=
