# DataBridge server: infrastructure settings only. Business settings (retention, limits,
# templates) are setups in the database, edited through /api/setup.
#
# Override with --config <file> or environment variables:
#   DATABRIDGE_HOST, DATABRIDGE_PORT, DATABRIDGE_DB_URL, DATABRIDGE_DB_USER,
#   DATABRIDGE_DB_PASSWORD, DATABRIDGE_SWEEP_MINUTES

# Local only until sign-in (P0-03) is in place.
server.host=127.0.0.1
server.port=8085

# Development default: in-memory H2 in SQL Server mode. Data is lost on restart.
# For SQL Server, e.g.:
#   db.url=jdbc:sqlserver://localhost:1433;databaseName=DataBridge;encrypt=true;trustServerCertificate=true
db.url=jdbc:h2:mem:databridge;MODE=MSSQLServer;DATABASE_TO_UPPER=FALSE;DB_CLOSE_DELAY=-1
db.user=sa
db.password=

# How often expired client workspaces are destroyed.
retention.sweepIntervalMinutes=15
